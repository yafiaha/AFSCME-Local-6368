<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join CAT - AFSCME Local 6368</title>
  <meta name="description" content="Join the AFSCME Local 6368 Contract Action Team (CAT)." />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f8f3;
      color: #1f2937;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f7a3f;
      color: #ffffff;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
    }

    header p {
      margin: 8px 0 0;
      font-size: 1rem;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: min(100%, 720px);
      background: #ffffff;
      border: 2px solid #d6eadb;
      border-radius: 14px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(31, 122, 63, 0.12);
    }

    .card h2 {
      margin-top: 0;
      color: #1f7a3f;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }

    .card p {
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .cat-button {
      display: inline-block;
      padding: 15px 30px;
      background: #1f7a3f;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.08rem;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .cat-button:hover,
    .cat-button:focus {
      background: #155d2e;
      transform: translateY(-1px);
    }

    footer {
      background: #174b2a;
      color: #ffffff;
      text-align: center;
      padding: 18px 20px;
      font-size: 0.9rem;
    }

    footer a {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>AFSCME Local 6368</h1>
    <p>Contract Action Team</p>
  </header>

  <main>
    <section class="card">
      <h2>Join CAT – Contract Action Team</h2>
      <p>
        Get involved and help strengthen our union. Join the AFSCME Local 6368
        Contract Action Team (CAT) by completing the form below.
      </p>

      <a
        class="cat-button"
        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=XAKiufQVOEKJv0mCIBh5fJuXCL_9G9FAg25ktmj7SzFUOFlLWDdBTFpEQlpJMEtMVEFNRjRXRjNCViQlQCN0PWcu"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join CAT – Contract Action Team
      </a>
    </section>
  </main>

  <footer>
    &copy; 2026 AFSCME Local 6368 &nbsp;|&nbsp;
    <a href="https://afscme6368.org">afscme6368.org</a>
  </footer>

</body>
</html>
